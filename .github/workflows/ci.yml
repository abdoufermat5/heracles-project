name: ci

on:
  push:
  pull_request:
  # called by release.yml: the publish jobs wait for these same jobs
  workflow_call:

# Read-only token: the jobs only check out the code and run tests.
permissions:
  contents: read

# A new push to the same ref supersedes the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to the commit of the release they were reviewed at
# (the comment names the tag).
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    # PostgreSQL is mandatory on Kubernetes: the PostgresDatabase tests (advisory locks, task
    # leases, dump/restore) run against a real server instead of being skipped.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: heracles
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HERACLES_TEST_POSTGRES_URL: postgresql://postgres:heracles@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: System libraries for python-ldap
        run: sudo apt-get update && sudo apt-get install -y libldap2-dev libsasl2-dev
        working-directory: .
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      # --locked: fail when uv.lock is out of date instead of silently re-resolving
      - run: uv sync --locked --extra ldap --extra postgres
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - name: Tests (the PostgreSQL ones must run, not be skipped)
        run: |
          uv run pytest -rs | tee "$RUNNER_TEMP/pytest.log"
          if grep -q 'HERACLES_TEST_POSTGRES_URL is not set' "$RUNNER_TEMP/pytest.log"; then
            echo "::error::PostgreSQL tests were skipped"; exit 1
          fi

  # Known vulnerabilities in the locked runtime dependencies (backend: every extra the image
  # installs; frontend: production dependencies, high severity and above).
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: pip-audit on uv.lock
        working-directory: backend
        run: |
          uv export --locked --no-dev --all-extras --no-emit-project --format requirements-txt \
            -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --require-hashes --disable-pip
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.22.0
      - name: pnpm audit
        working-directory: frontend
        run: pnpm audit --prod --audit-level high

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # frontend/package.json has no `packageManager` field: name the version explicitly
      # (the same one the Dockerfile installs).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test --run
      # `build` type-checks (tsc -b) before bundling
      - run: pnpm build
      - run: pnpm check:bundle

  # The python-ldap integration tests, the backend end-to-end tests and the browser tests on
  # every directory server of the support matrix (manual/servers.md). The sudo and SSH key
  # schemas are fetched at pinned upstream commits; there is no DNS zone schema in CI.
  directory-servers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        server: [openldap, 389ds]
    env:
      HERACLES_E2E_WITHOUT: dns
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Third-party schemas
        run: deploy/ldap/fetch-third-party.sh
      - name: OpenLDAP stack
        if: matrix.server == 'openldap'
        run: |
          # with the test OpenID Connect provider (profile oidc): the sign-in spec runs here only
          docker compose -f deploy/docker-compose.yml --profile e2e --profile oidc up -d --build --wait heracles idp
          docker compose -f deploy/docker-compose.yml --profile e2e run --rm integration
          echo "HERACLES_E2E_URL=http://localhost:8420" >> "$GITHUB_ENV"
      - name: 389 Directory Server stack
        if: matrix.server == '389ds'
        run: |
          docker build -q -f deploy/Dockerfile -t heracles-ds .
          docker build -q -f deploy/Dockerfile --target test -t heracles-ds-test .
          deploy/ds/setup.sh heracles-ds 3391
          IMAGE=heracles-ds deploy/ds/heracles.sh 3391 8431 heracles-ds-app
          docker run --rm --network host -e HERACLES_TEST_LDAP_URI=ldap://127.0.0.1:3391 \
            -e "HERACLES_TEST_LDAP_BIND_DN=cn=Directory Manager" \
            -e HERACLES_TEST_LDAP_BIND_PASSWORD=admin heracles-ds-test
          echo "HERACLES_E2E_URL=http://127.0.0.1:8431" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Backend end-to-end tests
        working-directory: backend
        run: |
          uv sync --locked
          uv run pytest -q -m e2e tests/e2e
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Browser tests
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          # one retry: the two-factor test waits for a fresh 30-second code
          pnpm exec playwright test --retries=1
      - name: Diagnostics
        if: failure()
        run: |
          docker ps -a
          docker logs heracles-ds-app 2>&1 | tail -80 || true
          docker compose -f deploy/docker-compose.yml --profile e2e logs --tail 80 heracles || true

  # The Helm chart and the plain manifests (deploy/helm, deploy/kubernetes) on a throwaway kind
  # cluster: PostgreSQL and a seeded OpenLDAP run in the cluster, the image is built here.
  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHART: deploy/helm/heracles
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          version: v0.25.0
          node_image: kindest/node:v1.31.2
          cluster_name: heracles
      - name: Lint and render the manifests
        run: |
          helm lint "$CHART" -f "$CHART/ci/test-values.yaml"
          helm template heracles "$CHART" -f "$CHART/ci/test-values.yaml" \
            --set ingress.enabled=true | kubectl apply --dry-run=client -f -
          kubectl apply --dry-run=client -k deploy/kubernetes
      - name: Build the image and load it into the cluster
        run: |
          docker build -f deploy/Dockerfile -t heracles:ci .
          kind load docker-image heracles:ci --name heracles
      - name: PostgreSQL and OpenLDAP (seeded from deploy/ldap)
        run: |
          kubectl create configmap ldap-seed --from-file=deploy/ldap/seed.ldif
          kubectl create configmap ldap-schema \
            $(printf -- '--from-file=%s ' deploy/ldap/schema/*.ldif)
          kubectl apply -f "$CHART/ci/backing-services.yaml"
          kubectl rollout status deployment/postgres deployment/openldap --timeout=300s
      - name: Install the chart
        run: |
          kubectl create secret generic heracles-secrets \
            --from-literal=bind_password=admin \
            --from-literal=database_url=postgresql://heracles:heracles@postgres:5432/heracles
          helm install heracles "$CHART" -f "$CHART/ci/kind-values.yaml" --wait --timeout 5m
          kubectl rollout status deployment/heracles-web deployment/heracles-worker --timeout=300s
      - name: /readyz answers 200
        run: |
          kubectl port-forward svc/heracles 8420:8420 &
          sleep 3
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 2 \
            http://127.0.0.1:8420/readyz | tee readyz.json
          grep -q '"status":"ok"' readyz.json
      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods,svc -o wide
          kubectl describe pods -l app.kubernetes.io/name=heracles
          kubectl logs -l app.kubernetes.io/name=heracles --all-containers --tail=100 --prefix
          kubectl logs deployment/openldap --tail=60

  # Two replicas behind a load balancer sharing PostgreSQL (make e2e-replicas): the browser
  # tests of the multi-replica behaviour (sessions, locks, task leases across processes).
  replicas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Third-party schemas
        run: deploy/ldap/fetch-third-party.sh
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Browser dependencies
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Multi-replica end-to-end tests
        run: make e2e-replicas
      - name: Diagnostics
        if: failure()
        run: |
          docker ps -a
          docker compose -p hrc-replicas -f deploy/docker-compose.yml --profile replicas \
            logs --tail 80 || true

  # Scale benchmark (backend/bench/bench.py) on 2,000 users in the in-memory directory,
  # compared with the committed baseline (backend/bench/bench-baseline.json): fails when the
  # median latency of a scenario (scaled by the runner's speed) or its LDAP operation counts grow
  # more than 2x. After an intended change: `make bench-baseline` and commit the file.
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Run the benchmark
        run: >
          uv run python bench/bench.py --users 2000 --repeat 3 --no-check
          --json "$RUNNER_TEMP/bench.json" --markdown "$RUNNER_TEMP/bench.md"
      - name: Compare with the baseline
        run: |
          cat "$RUNNER_TEMP/bench.md" >> "$GITHUB_STEP_SUMMARY"
          uv run python bench/bench_compare.py bench/bench-baseline.json "$RUNNER_TEMP/bench.json"
