# Example only, NOT part of kustomization.yaml: create the real Secret yourself and never commit
# it, for example
#
#   kubectl create secret generic heracles-secrets \
#     --from-file=bind_password=./bind_password \
#     --from-literal=database_url='postgresql://heracles:CHANGE_ME@postgres:5432/heracles'
#
# Every key is mounted as a file in /etc/heracles/secrets (reference it from the configuration
# with bind_password_file, mail.password_file, ...); `database_url` is also passed to the
# containers as $HERACLES_DATABASE_URL (an external PostgreSQL: the replicas and the worker
# share their state through it).
apiVersion: v1
kind: Secret
metadata:
  name: heracles-secrets
  labels:
    app.kubernetes.io/name: heracles
type: Opaque
stringData:
  bind_password: CHANGE_ME
  database_url: postgresql://heracles:CHANGE_ME@postgres:5432/heracles
