# Heracles configuration, fully commented. The setup wizard (or `heracles init`) writes a
# file like this one; write it by hand only if you prefer. Keep it readable by the Heracles
# user only: it holds the service account password. Nothing here is a real secret.
#
# Path: $HERACLES_CONFIG or `heracles serve --config PATH`.

# --- the directory ------------------------------------------------------------------------
directories:
  - id: main                        # short identifier, used in URLs and the audit log
    label: Main directory           # name shown in the console
    uri: ldaps://ldap.example.org   # ldap://, ldaps:// or ldapi://
    # starttls: true                # upgrade an ldap:// connection (not needed with ldaps://)
    # ca_file: /etc/ssl/certs/corp-ca.pem   # CA to trust when the server uses a private one
    bind_dn: cn=heracles,ou=services,dc=example,dc=org   # service account the console uses
    bind_password: CHANGE_ME        # or set HERACLES_DIRECTORY_MAIN_BIND_PASSWORD instead
    base_dn: dc=example,dc=org
    # timeout: 10                   # seconds before an operation gives up
    # pool_size: 8                  # connections kept open to the server

# --- the console --------------------------------------------------------------------------
api:
  # Accounts that bypass the access rules (bootstrap administrators). Keep it short; delegate
  # everyday administration with roles instead.
  admin_dns:
    - uid=admin,ou=people,dc=example,dc=org

  # Host names the console may build links from (invitations, CAS). Set your public name.
  allowed_hosts: ["heracles.example.org"]

  # Reverse proxy in front of the console (TLS termination): the address the console sees it
  # connect from (in a container, the Docker network gateway, e.g. 172.16.0.0/12). Only a listed peer is
  # believed when it sends X-Forwarded-For / X-Forwarded-Proto, which the client address of the
  # login throttling, the audit log and the HSTS header rely on.
  # login:
  #   trusted_proxies: ["172.16.0.0/12"]

  session:
    cookie_secure: true             # false only when you serve plain http (trials)
    # idle_timeout_seconds: 1800
    # absolute_timeout_seconds: 28800

  # Built console to serve. The container image finds /app/static by itself.
  # static_dir: /app/static

  # Application database: sessions, login throttling, task reports, plugin switches.
  # Default: SQLite in $HERACLES_DATA_DIR/heracles.db.
  # database:
  #   path: /var/lib/heracles/heracles.db
  #   # Or PostgreSQL, to share state between replicas on several hosts:
  #   # url: postgresql://heracles:CHANGE_ME@postgres:5432/heracles

  # Largest request body in bytes (413 above), and the larger limit of the import endpoints.
  # max_body_bytes: 10485760
  # max_import_body_bytes: 33554432

# --- plugins ------------------------------------------------------------------------------
# Extensions that are on. Absent key: the core profile (posix, ssh, sudo, mail, audit,
# acl_admin, ppolicy). A plugin only works if the directory schema supports it. The console
# can switch plugins later; its choice is stored in the database and wins over this list.
plugins:
  enabled: [posix, ssh, sudo, mail, audit, acl_admin, ppolicy]
  # enabled: ["*"]                  # every plugin the schema supports

# --- outgoing mail (password recovery, reminders, notifications) ----------------------------
# Without a host, the tasks that send mail are skipped and reported as such.
# mail:
#   host: smtp.example.org
#   port: 587
#   sender: heracles@example.org
#   starttls: true
#   username: heracles
#   password: CHANGE_ME

# --- audit ---------------------------------------------------------------------------------
# Forward the recorded audit events to syslog.
# audit:
#   syslog:
#     address: "logs.example.org:514"   # or a socket path such as /dev/log
#     facility: local0
