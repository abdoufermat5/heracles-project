# Development / integration-test LDAP server.
#
# Image choice: bitnamilegacy/openldap:2.6 is the former bitnami/openldap
# OpenLDAP 2.6 image (now frozen): it loads *.ldif data from /ldifs and schema
# LDIFs from /schemas at first start and runs unprivileged on port 1389.
# It is used for tests only.
#
#   docker compose -f deploy/docker-compose.yml up -d
#   export HERACLES_TEST_LDAP_URI=ldap://localhost:1389
#   uv run --extra ldap pytest -m integration
#
# Schemas: deploy/ldap/schema/ holds the Heracles schema (heracles.ldif) and the
# third-party schemas some plugins need (sudo, openssh-lpk, dnszone, kerberos, dhcp...;
# see its README). They are loaded at the first start of the data volume.

services:
  ldap:
    image: bitnamilegacy/openldap:2.6
    ports:
      # loopback only: the test directory has well-known credentials (admin / admin)
      - "127.0.0.1:1389:1389"
    environment:
      LDAP_ROOT: dc=heracles,dc=test
      LDAP_ADMIN_USERNAME: admin
      LDAP_ADMIN_PASSWORD: admin
      LDAP_CUSTOM_LDIF_DIR: /ldifs
      LDAP_CUSTOM_SCHEMA_DIR: /schemas
      # Base tree is created by the image; the seed adds the rest.
      LDAP_SKIP_DEFAULT_TREE: "yes"
      LDAP_EXTRA_SCHEMAS: cosine,inetorgperson,nis
    volumes:
      - ./ldap/seed.ldif:/ldifs/seed.ldif:ro
      - ./ldap/schema:/schemas:ro
      - ldap-data:/bitnami/openldap
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost:1389 -b dc=heracles,dc=test -D cn=admin,dc=heracles,dc=test -w admin -s base dn"]
      interval: 5s
      timeout: 3s
      retries: 20

  # End-to-end stack: docker compose -f deploy/docker-compose.yml --profile e2e up -d --build
  heracles:
    # `dev` runs the same container against the test LDAP for `make dev`, with the same
    # configuration file. Its `api.login.trusted_proxies` trusts the Docker bridge network so
    # the audit log and the sessions list record the browser address the Vite proxy forwards
    # (`xfwd`), not the gateway the connection reaches the published port from.
    profiles: [e2e, dev]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:8420:8420"
    volumes:
      - ./e2e/heracles.yaml:/etc/heracles/heracles.yaml:ro
      - heracles-data:/var/lib/heracles
    depends_on:
      ldap:
        condition: service_healthy

  # python-ldap integration tests: docker compose ... --profile e2e run --rm integration
  integration:
    profiles: [e2e]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: test
    depends_on:
      ldap:
        condition: service_healthy

  # Authoritative DNS for the zones of the test directory (port 15353 on the host).
  dns:
    profiles: [dev, e2e]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["heracles", "dns", "--config", "/etc/heracles/heracles.yaml", "--host", "0.0.0.0", "--port", "5353"]
    ports:
      - "127.0.0.1:15353:5353/udp"
      - "127.0.0.1:15353:5353/tcp"
    volumes:
      - ./e2e/heracles.yaml:/etc/heracles/heracles.yaml:ro
    depends_on:
      ldap:
        condition: service_healthy
    # The image's healthcheck asks the HTTP API, which this container does not serve.
    healthcheck:
      test: ["CMD", "python", "-c", "import dns.message, dns.query; dns.query.udp(dns.message.make_query('localhost', 'A'), '127.0.0.1', port=5353, timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ---- dev services: real servers that read the accounts/config Heracles writes -----------------
  # Every service below reads the dev directory directly (see deploy/dev/). Ports are
  # loopback-only; the credentials are the well-known dev ones (ldap / admin / admin).
  smb:
    profiles: [dev]
    build:
      context: ./dev/smb
    ports:
      - "127.0.0.1:445:445"
    volumes:
      - smb-data:/srv/smb/shared
    depends_on:
      ldap:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/445'"]
      interval: 5s
      timeout: 5s
      retries: 30

  ftp:
    profiles: [dev]
    build:
      context: ./dev/ftp
    ports:
      # Control port and the passive range the server announces.
      - "127.0.0.1:2121:21"
      - "127.0.0.1:30000-30009:30000-30009"
    volumes:
      - ftp-data:/srv/ftp
    # The server switches its own capabilities at start (Debian builds it with libcap).
    cap_add: [SYS_NICE, DAC_READ_SEARCH]
    depends_on:
      ldap:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD-SHELL"
        - "timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/21; head -c 3 <&3 | grep -q 220'"
      interval: 5s
      timeout: 5s
      retries: 30

  # Serves the isolated `dhcp-lab` network only; nothing is published on the host, so it
  # cannot hand out leases on the host LAN.
  dhcp:
    profiles: [dev]
    build:
      context: ./dev/dhcp
    networks:
      default: {}
      dhcp-lab:
        ipv4_address: 192.168.220.2
    depends_on:
      ldap:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x dhcpd >/dev/null && ss -lunH | grep -q ':67'"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot client on the isolated network (fixed MAC -> fixed address from the
  # directory): docker compose ... --profile dhcp-test run --rm dhcp-client
  dhcp-client:
    profiles: [dhcp-test]
    image: alpine:3.22
    mac_address: "52:54:00:fe:dc:01"
    networks:
      dhcp-lab: {}
    cap_add: [NET_ADMIN]
    command:
      - sh
      - -c
      - "ip link set eth0 up; ip addr flush dev eth0; udhcpc -f -q -n -i eth0 -t 5 -T 3"

  # ---- replicas profile: two Heracles servers behind a load balancer ---------------------------
  # Several replicas on different hosts share their state through PostgreSQL. This profile runs
  # the same topology on one machine; point the e2e suite at the balancer (port 8430):
  #   docker compose -p hrc-replicas -f deploy/docker-compose.yml --profile replicas \
  #     up -d --build balancer
  # (name the balancer: the plain `ldap` service has no profile and would also start, on 1389).
  # Use a separate project name (-p): it has its own directory and database, and publishes only
  # 8421, 8422 (the replicas) and 8430 (the balancer).
  ldap-replicas:
    profiles: [replicas]
    extends:
      service: ldap
    ports: !override []
    volumes:
      - ./ldap/seed.ldif:/ldifs/seed.ldif:ro
      - ./ldap/schema:/schemas:ro
      - ldap-replicas-data:/bitnami/openldap

  postgres:
    profiles: [replicas]
    image: postgres:17
    environment:
      POSTGRES_USER: heracles
      POSTGRES_PASSWORD: heracles
      POSTGRES_DB: heracles
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heracles -d heracles"]
      interval: 3s
      timeout: 3s
      retries: 20

  heracles-1: &replica
    profiles: [replicas]
    image: heracles-replica:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:8421:8420"
    volumes:
      - ./e2e/heracles-replicas.yaml:/etc/heracles/heracles.yaml:ro
    depends_on:
      ldap-replicas:
        condition: service_healthy
      postgres:
        condition: service_healthy

  heracles-2:
    <<: *replica
    # same image as heracles-1 (built once)
    build: !reset null
    ports:
      - "127.0.0.1:8422:8420"
    depends_on:
      heracles-1:
        condition: service_started
      ldap-replicas:
        condition: service_healthy
      postgres:
        condition: service_healthy

  balancer:
    profiles: [replicas]
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8430:8430"
    volumes:
      - ./e2e/replicas-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      heracles-1:
        condition: service_healthy
      heracles-2:
        condition: service_healthy

networks:
  # Isolated network served by the `dhcp` service: no host publishing, and the dynamic
  # allocation starts at .128 so the fixed address of the test client (.50) stays free.
  dhcp-lab:
    ipam:
      config:
        - subnet: 192.168.220.0/24
          ip_range: 192.168.220.128/25

volumes:
  ldap-data:
  heracles-data:
  postgres-data:
  ldap-replicas-data:
  smb-data:
  ftp-data:
