# NSS lookups for the dev SMB server: the Unix accounts it works with come from
# the dev directory (posixAccount entries), so getpwnam()/getgrnam() answer.
uid nslcd
gid nslcd

uri ldap://ldap:1389
base dc=heracles,dc=test
binddn cn=admin,dc=heracles,dc=test
bindpw admin
pagesize 1000
referrals off
idle_timelimit 3600

filter passwd (&(objectClass=posixAccount)(uid=*))
map passwd uid uid
map passwd uidNumber uidNumber
map passwd gidNumber gidNumber
map passwd homeDirectory homeDirectory
map passwd gecos cn
map passwd loginShell loginShell

filter group (&(objectClass=posixGroup)(cn=*))
map group cn cn
map group gidNumber gidNumber
map group memberUid memberUid

filter shadow (&(objectClass=shadowAccount)(uid=*))
