# SMB server of the dev stack: accounts, groups and the domain come from the
# dev directory. The credentials below are the dev-only directory ones
# (see deploy/docker-compose.yml: ldap / admin / admin).
[global]
	workgroup = HERACLES
	# A standalone server names its domain entry after the netbios name: keep it
	# equal to the sambaDomainName entry of the directory (seed.ldif).
	netbios name = HERACLES
	server string = Heracles dev SMB server
	server role = standalone server
	security = user
	map to guest = never

	# Accounts live in the directory; the server makes its own account
	# changes there (smbpasswd -w stores the bind password in secrets.tdb).
	passdb backend = ldapsam:ldap://ldap:1389
	ldap admin dn = cn=admin,dc=heracles,dc=test
	ldap suffix = dc=heracles,dc=test
	ldap user suffix = ou=people,dc=heracles,dc=test
	ldap group suffix = ou=groups,dc=heracles,dc=test
	ldap machine suffix = ou=computers,dc=heracles,dc=test
	ldap ssl = off
	ldap passwd sync = only
	ldap delete dn = no

	domain logons = no
	load printers = no
	printing = bsd
	printcap name = /dev/null
	disable spoolss = yes

	server min protocol = SMB2_02
	server max protocol = SMB3
	log level = 1
	max log size = 50

[shared]
	comment = Shared files for authenticated users
	path = /srv/smb/shared
	browseable = yes
	read only = no
	guest ok = no
	create mask = 0664
	directory mask = 0775
	force create mode = 0664
	force directory mode = 0775
