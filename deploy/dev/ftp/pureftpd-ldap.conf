# LDAP backend of the dev FTP server. Credentials: dev directory only.
LDAPScheme ldap
LDAPServer ldap
LDAPPort 1389
LDAPBaseDN ou=people,dc=heracles,dc=test
LDAPBindDN cn=admin,dc=heracles,dc=test
LDAPBindPW admin
LDAPVersion 3
LDAPUseTLS False
# Authenticate by binding as the user's own entry: works with any password
# hash the directory accepts.
LDAPAuthMethod BIND
# Only accounts enabled for FTP (FTPStatus TRUE, written by the console).
LDAPFilter (&(objectClass=posixAccount)(FTPStatus=TRUE)(uid=\L))
LDAPHomeDir homeDirectory
