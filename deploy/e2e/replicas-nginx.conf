# Round-robin load balancer in front of the Heracles replicas (no stickiness on purpose: the
# replicas share their state through the application database).
upstream heracles {
    server heracles-1:8420;
    server heracles-2:8420;
}

server {
    listen 8430;
    client_max_body_size 40m;

    location / {
        proxy_pass http://heracles;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        add_header X-Upstream $upstream_addr always;
    }
}
