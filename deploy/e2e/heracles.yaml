# Configuration of the end-to-end test stack and `make dev` (both profiles mount this file).
directories:
  - id: main
    label: Test directory
    uri: ldap://ldap:1389
    bind_dn: cn=admin,dc=heracles,dc=test
    bind_password: admin
    base_dn: dc=heracles,dc=test
api:
  # bootstrap administrator (ACLs ignored for this account)
  admin_dns: ["uid=alice,ou=people,dc=heracles,dc=test"]
  static_dir: /app/static
  enable_docs: true
  session:
    cookie_secure: false
  # The browser reaches the container through the Docker network gateway (the Vite dev server
  # proxy, a published port): believe X-Forwarded-For from that gateway (Docker bridge networks
  # live in 172.16.0.0/12) so the audit log and the sessions list show the real client address
  # instead of the gateway's. Do not list the clients' own ranges here.
  login:
    trusted_proxies: ["172.16.0.0/12"]
  # Application database (second-factor registrations, ...); default
  # $HERACLES_DATA_DIR/heracles.db, i.e. /var/lib/heracles/heracles.db in the image.
  # database:
  #   path: /var/lib/heracles/heracles.db
  # Host names the server may build links from (CAS service URL, invitation links) when no public
  # address is configured (cas_service_name, the invitations public_base_url). Defaults to the
  # local addresses; set it to the console's public host name in production.
  # allowed_hosts: ["heracles.example.org", "*.corp.example.org"]
  # Largest request body in bytes (413 above; chunked bodies included) and the larger limit of
  # the import endpoints.
  # max_body_bytes: 10485760
  # max_import_body_bytes: 33554432
# Plugins on in this stack: the core profile plus dns, systems and archive. Absent key: the
# core profile only. The console can switch plugins at runtime (stored in the database, wins
# over this list).
plugins:
  enabled: [posix, ssh, sudo, mail, audit, acl_admin, ppolicy, dns, systems, archive]

# Outgoing mail (password recovery, reminder/notification/extractor tasks). Without a host,
# the tasks that send mail are skipped and reported as such.
# mail:
#   host: smtp.example.org
#   port: 587
#   sender: heracles@example.org
#   starttls: true
#   username: heracles
#   password: secret
#
# Forward the audit events recorded by the audit tasks to syslog.
# audit:
#   syslog:
#     address: "logs.example.org:514"   # or a socket path such as /dev/log
#     facility: local0
