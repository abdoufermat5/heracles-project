[project]
name = "heracles"
version = "0.1.0"
description = "Heracles — web console for LDAP directory management"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162.5",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "pyyaml>=6.0.3",
  "argon2-cffi>=25.1.0",
  "libpass>=1.9.4",
  "pyotp>=2.10.0",
  "webauthn>=3.0.1",
  "bcrypt>=5.0.0",
  "httpx2>=2.16.0",
]

[project.optional-dependencies]
ldap = ["python-ldap>=3.4.4"]  # needs libldap2-dev + libsasl2-dev
dns = ["dnspython>=2.7"]
# shared application database for several replicas on different hosts
postgres = ["psycopg[binary,pool]==3.3.8", "psycopg-pool==3.3.3"]

[project.scripts]
heracles = "heracles.cli.main:main"

[project.entry-points."heracles.plugins"]
dns = "heracles_plugins.dns:plugin"
mail = "heracles_plugins.mail:plugin"
posix = "heracles_plugins.posix:plugin"
ssh = "heracles_plugins.ssh:plugin"
sudo = "heracles_plugins.sudo:plugin"
systems = "heracles_plugins.systems:plugin"
user_reminder = "heracles_plugins.user_reminder:plugin"
personal = "heracles_plugins.personal:plugin"
ppolicy = "heracles_plugins.ppolicy:plugin"
dhcp = "heracles_plugins.dhcp:plugin"
smb_accounts = "heracles_plugins.smb_accounts:plugin"
audit = "heracles_plugins.audit:plugin"
archive = "heracles_plugins.archive:plugin"
lifecycle = "heracles_plugins.lifecycle:plugin"
notifications = "heracles_plugins.notifications:plugin"
extractor = "heracles_plugins.extractor:plugin"
automatic_groups = "heracles_plugins.automatic_groups:plugin"
applications = "heracles_plugins.applications:plugin"
dyngroups = "heracles_plugins.dyngroups:plugin"
mixedgroups = "heracles_plugins.mixedgroups:plugin"
dsa = "heracles_plugins.dsa:plugin"
invitations = "heracles_plugins.invitations:plugin"
public_forms = "heracles_plugins.public_forms:plugin"
ipam = "heracles_plugins.ipam:plugin"
netgroups = "heracles_plugins.netgroups:plugin"
autofs5 = "heracles_plugins.autofs5:plugin"
weblink = "heracles_plugins.weblink:plugin"
ipmi = "heracles_plugins.ipmi:plugin"
kerberos = "heracles_plugins.kerberos:plugin"
certificates = "heracles_plugins.certificates:plugin"
pgp_keys = "heracles_plugins.pgp_keys:plugin"
physical_key = "heracles_plugins.physical_key:plugin"
pki_certificates = "heracles_plugins.pki_certificates:plugin"
imap_mailbox = "heracles_plugins.imap_mailbox:plugin"
mail_store = "heracles_plugins.mail_store:plugin"
mail_transport = "heracles_plugins.mail_transport:plugin"
sieve = "heracles_plugins.sieve:plugin"
spam_filter = "heracles_plugins.spam_filter:plugin"
groupware = "heracles_plugins.groupware:plugin"
calendar_resources = "heracles_plugins.calendar_resources:plugin"
mail_protection = "heracles_plugins.mail_protection:plugin"
file_sharing = "heracles_plugins.file_sharing:plugin"
ftp_accounts = "heracles_plugins.ftp_accounts:plugin"
quota = "heracles_plugins.quota:plugin"
radius = "heracles_plugins.radius:plugin"
# --- P3 objects ---
macro = "heracles_plugins.macro:plugin"
# --- P3 admin ---
acl_admin = "heracles_plugins.acl_admin:plugin"
# --- P3 compat ---
ldapmanager = "heracles_plugins.ldapmanager:plugin"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.115",
  "httpx>=0.27",
  "pyright>=1.1.390",
  "ruff>=0.8",
  "types-pyyaml>=6.0.12.20261103",
  "pytest-cov>=7.1.0",
  "httpx2>=2.16.0",
  "dnspython>=2.7",
  "psycopg[binary,pool]==3.3.8",
  "psycopg-pool==3.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heracles", "src/heracles_plugins"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802"]
"tests/e2e/**" = ["S", "N802", "E501"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: needs a real LDAP server (set HERACLES_TEST_LDAP_URI)",
  "e2e: needs the running container stack (set HERACLES_E2E_URL)",
]
