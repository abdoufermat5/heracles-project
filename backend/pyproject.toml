[project]
name = "heracles"
version = "0.1.0"
description = "Heracles — web console for LDAP directory management"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "pyyaml>=6.0.3",
  "argon2-cffi>=25.1.0",
  "libpass>=1.9.4",
  "pyotp>=2.10.0",
  "webauthn>=3.0.1",
  "authlib>=1.9.5",
  "itsdangerous>=2.2.0",
  "bcrypt>=5.0.0",
]

[project.optional-dependencies]
ldap = ["python-ldap>=3.4.4"]  # needs libldap2-dev + libsasl2-dev

[project.scripts]
heracles = "heracles.cli.main:main"

[project.entry-points."heracles.plugins"]
posix = "heracles_plugins.posix:plugin"
ssh = "heracles_plugins.ssh:plugin"
sudo = "heracles_plugins.sudo:plugin"
personal = "heracles_plugins.personal:plugin"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.115",
  "httpx>=0.27",
  "pyright>=1.1.390",
  "ruff>=0.8",
  "types-pyyaml>=6.0.12.20261103",
  "pytest-cov>=7.1.0",
  "httpx2>=2.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heracles", "src/heracles_plugins"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: needs a real LDAP server (set HERACLES_TEST_LDAP_URI)"]
